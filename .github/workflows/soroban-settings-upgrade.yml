# Submits the transactions for one Soroban settings upgrade to futurenet or
# testnet, using scripts/soroban-settings-upgrade.sh with a fresh
# friendbot-funded account, and exits. It does not arm anything. The
# ConfigUpgradeSetKey to arm is published for tooling as the job output
# `config_upgrade_set_key` and as the `config-upgrade-set` artifact
# (config-upgrade-set.json), and for people as an annotation and in the run
# summary. A multi-phase upgrade is one run per settings file, each armed and
# applied before the next is started.

name: Soroban settings upgrade

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network to submit to
        type: choice
        options:
          - futurenet
          - testnet
        default: futurenet
      settings_file:
        description: Settings JSON to submit, relative to the repo root
        type: string
        required: true
      core_image:
        description: stellar-core image used to build the transactions; must understand the settings file's XDR
        type: string
        default: stellar/stellar-core:latest
      stellar_xdr_version:
        description: stellar-xdr CLI release used to encode the settings file
        type: string
        default: 30.0.0
      resource_fee:
        description: Additional resource fee added to each transaction
        type: string
        default: "100"

permissions:
  contents: read

concurrency:
  group: soroban-settings-upgrade-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      config_upgrade_set_key: ${{ steps.submit.outputs.config_upgrade_set_key }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install stellar-xdr
        env:
          VERSION: ${{ inputs.stellar_xdr_version }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --retry 5 --retry-all-errors -fsSL -o "$HOME/.local/bin/stellar-xdr" \
            "https://github.com/stellar/rs-stellar-xdr/releases/download/v${VERSION}/stellar-xdr-${VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/stellar-xdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up stellar-core
        env:
          IMAGE: ${{ inputs.core_image }}
        run: |
          docker pull "$IMAGE"
          # The image's entrypoint is stellar-core; -i passes through the
          # secret seed that get-settings-upgrade-txs reads from stdin.
          cat > "$RUNNER_TEMP/stellar-core" <<EOF
          #!/bin/sh
          exec docker run --rm -i "$IMAGE" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/stellar-core"
          "$RUNNER_TEMP/stellar-core" version

      - name: Submit settings upgrade
        id: submit
        env:
          NETWORK: ${{ inputs.network }}
          SETTINGS_FILE: ${{ inputs.settings_file }}
          RESOURCE_FEE: ${{ inputs.resource_fee }}
          COMMIT: ${{ github.sha }}
        run: |
          RESULT="$RUNNER_TEMP/result.json"
          ./scripts/soroban-settings-upgrade.sh "$SETTINGS_FILE" \
            --network "$NETWORK" \
            --no-schedule \
            --resource-fee "$RESOURCE_FEE" \
            --core-bin "$RUNNER_TEMP/stellar-core" \
            --result-file "$RESULT"
          # One run submits one file, so the result has exactly one entry.
          [ "$(jq length "$RESULT")" -eq 1 ] || { echo "error: expected one submitted phase in $RESULT"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          jq --arg commit "$COMMIT" --arg run_id "$GITHUB_RUN_ID" \
            '.[0] + {commit: $commit, run_id: $run_id}' "$RESULT" > "$RUNNER_TEMP/out/config-upgrade-set.json"
          cat "$RUNNER_TEMP/out/config-upgrade-set.json"
          echo "config_upgrade_set_key=$(jq -r .config_upgrade_set_key "$RUNNER_TEMP/out/config-upgrade-set.json")" >> "$GITHUB_OUTPUT"

      - name: Publish the ConfigUpgradeSetKey
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-upgrade-set
          path: ${{ runner.temp }}/out/config-upgrade-set.json
          if-no-files-found: error
