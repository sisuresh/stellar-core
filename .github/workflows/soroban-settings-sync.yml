name: Soroban settings sync

# After a protocol upgrade on testnet, opens a PR copying testnet's live Soroban
# cost parameters into soroban-settings/testnet_settings_upgrade.json (see
# scripts/sync-soroban-settings-cost-params.sh), so the file matches the
# protocol's cost types the next time it is applied after a network reset.

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      network:
        description: Network to copy the cost params from
        type: choice
        options:
          - testnet
          - futurenet
        default: testnet
      settings_file:
        description: Settings file to update, relative to the repo root
        type: string
        default: soroban-settings/testnet_settings_upgrade.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-cost-params:
    # Scheduled runs only upstream; forks can still dispatch it by hand.
    if: github.repository == 'stellar/stellar-core' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      NETWORK: ${{ inputs.network || 'testnet' }}
      SETTINGS_FILE: ${{ inputs.settings_file || 'soroban-settings/testnet_settings_upgrade.json' }}
      STELLAR_XDR_VERSION: 30.0.0
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    - name: Install stellar-xdr
      run: |
        mkdir -p "$HOME/.local/bin"
        curl --retry 5 --retry-all-errors -fsSL -o "$HOME/.local/bin/stellar-xdr" \
          "https://github.com/stellar/rs-stellar-xdr/releases/download/v${STELLAR_XDR_VERSION}/stellar-xdr-${STELLAR_XDR_VERSION}-x86_64-unknown-linux-gnu"
        chmod +x "$HOME/.local/bin/stellar-xdr"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Copy live cost params into the settings file
      run: |
        set -o pipefail
        ./scripts/sync-soroban-settings-cost-params.sh \
          --network "$NETWORK" --file "$SETTINGS_FILE" | tee "$RUNNER_TEMP/sync.txt"

    - name: Open or update PR
      env:
        GH_TOKEN: ${{ github.token }}
        BASE: ${{ github.ref_name }}
      run: |
        if git diff --quiet
        then
          echo "$SETTINGS_FILE is up to date"
          exit 0
        fi
        BRANCH="bot/sync-soroban-settings-$NETWORK"
        PROTOCOL=$(sed -n 's/^.* is on protocol \([0-9][0-9]*\) .*$/\1/p' "$RUNNER_TEMP/sync.txt")
        TITLE="Sync $(basename "$SETTINGS_FILE") cost params with $NETWORK protocol $PROTOCOL"

        # Leave an open PR alone if it already makes the same change.
        OPEN_PR=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[].number')
        if [ -n "$OPEN_PR" ] &&
           git fetch --depth=1 origin "$BRANCH" 2>/dev/null &&
           git diff --quiet FETCH_HEAD -- "$SETTINGS_FILE"
        then
          echo "$BRANCH already has this change"
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git checkout -B "$BRANCH"
        git commit -qam "$TITLE" \
          -m "Copies $NETWORK's live contract_cost_params_* entries so the file matches protocol $PROTOCOL's cost types."
        git push -f origin "$BRANCH"

        BODY="$RUNNER_TEMP/body.md"
        {
          echo "$NETWORK is on protocol $PROTOCOL, and its live Soroban cost parameters differ from \`$SETTINGS_FILE\`, so this copies them over. Only the two \`contract_cost_params_*\` entries change. Opened by the \`${{ github.workflow }}\` workflow."
          echo
          echo "**Reviewer:** check that the changed and added cost types match the calibration expected for protocol $PROTOCOL, and that no other upgradeable setting introduced by this protocol also needs to be added to the file."
          echo
          echo '```'
          cat "$RUNNER_TEMP/sync.txt"
          echo '```'
        } > "$BODY"
        if [ -z "$OPEN_PR" ]
        then
          gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$BODY"
        else
          gh pr edit "$OPEN_PR" --title "$TITLE" --body-file "$BODY"
        fi
