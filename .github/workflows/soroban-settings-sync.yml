name: Soroban settings sync

# Opens a PR rewriting soroban-settings/testnet_settings_upgrade.json with
# testnet's live Soroban settings (see scripts/sync-soroban-settings.sh), so
# that after a protocol upgrade or settings change on testnet, applying the
# file after a network reset reproduces testnet's current settings.

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      network:
        description: Network to copy the settings from
        type: choice
        options:
          - testnet
          - futurenet
        default: testnet
      settings_file:
        description: Settings file to update, relative to the repo root
        type: string
        default: soroban-settings/testnet_settings_upgrade.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-settings:
    # Scheduled runs only upstream; forks can still dispatch it by hand.
    if: github.repository == 'stellar/stellar-core' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      NETWORK: ${{ inputs.network || 'testnet' }}
      SETTINGS_FILE: ${{ inputs.settings_file || 'soroban-settings/testnet_settings_upgrade.json' }}
      STELLAR_XDR_VERSION: 30.0.0
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    - name: Install stellar-xdr
      run: |
        mkdir -p "$HOME/.local/bin"
        curl --retry 5 --retry-all-errors -fsSL -o "$HOME/.local/bin/stellar-xdr" \
          "https://github.com/stellar/rs-stellar-xdr/releases/download/v${STELLAR_XDR_VERSION}/stellar-xdr-${STELLAR_XDR_VERSION}-x86_64-unknown-linux-gnu"
        chmod +x "$HOME/.local/bin/stellar-xdr"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Copy live settings into the settings file
      run: |
        set -o pipefail
        ./scripts/sync-soroban-settings.sh \
          --network "$NETWORK" --file "$SETTINGS_FILE" | tee "$RUNNER_TEMP/sync.txt"

    - name: Open or update PR
      env:
        GH_TOKEN: ${{ github.token }}
        BASE: ${{ github.ref_name }}
      run: |
        if git diff --quiet
        then
          echo "$SETTINGS_FILE is up to date"
          exit 0
        fi
        BRANCH="bot/sync-soroban-settings-$NETWORK"
        PROTOCOL=$(sed -n 's/^.* is on protocol \([0-9][0-9]*\) .*$/\1/p' "$RUNNER_TEMP/sync.txt")
        TITLE="Sync $(basename "$SETTINGS_FILE") with $NETWORK (protocol $PROTOCOL)"

        # Leave an open PR alone if it already makes the same change.
        OPEN_PR=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[].number')
        if [ -n "$OPEN_PR" ] &&
           git fetch --depth=1 origin "$BRANCH" 2>/dev/null &&
           git diff --quiet FETCH_HEAD -- "$SETTINGS_FILE"
        then
          echo "$BRANCH already has this change"
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git checkout -B "$BRANCH"
        git commit -qam "$TITLE" \
          -m "Copies $NETWORK's live upgradeable Soroban settings into the file."
        git push -f origin "$BRANCH"

        BODY="$RUNNER_TEMP/body.md"
        {
          echo "$NETWORK is on protocol $PROTOCOL, and its live Soroban settings differ from \`$SETTINGS_FILE\`, so this copies them over. Opened by the \`${{ github.workflow }}\` workflow."
          echo
          echo "**Reviewer:** check that every change below is intended on $NETWORK (a protocol upgrade or an approved settings upgrade), not a one-off experiment. Any *added* setting must be upgradeable, i.e. not excluded by \`SorobanNetworkConfig::isNonUpgradeableConfigSettingEntry\`."
          echo
          echo '```'
          cat "$RUNNER_TEMP/sync.txt"
          echo '```'
        } > "$BODY"
        if [ -z "$OPEN_PR" ]
        then
          gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$BODY"
        else
          gh pr edit "$OPEN_PR" --title "$TITLE" --body-file "$BODY"
        fi
